name: Build CTR Q8400 experimental (Windows)

on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "Upstream tag/branch/commit of GetLostIn/CTR-NitroFueled-PC to build (v0.4)"
        default: "v0.4"
        required: true

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout fork (workflow and avx-emulation.patch)
        uses: actions/checkout@v4
        with:
          path: input

      - name: Checkout upstream source with pinned submodules
        uses: actions/checkout@v4
        with:
          repository: GetLostIn/CTR-NitroFueled-PC
          ref: ${{ inputs.upstream_ref }}
          submodules: recursive
          path: source

      - name: Verify patch file
        shell: pwsh
        run: |
          if (!(Test-Path input/avx-emulation.patch)) { throw "Missing avx-emulation.patch in the root of your fork." }
          Copy-Item input/avx-emulation.patch source/avx-emulation.patch

      - name: Set up MSYS2 CLANG64
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          install: >-
            git
            patch
            mingw-w64-clang-x86_64-toolchain
            mingw-w64-clang-x86_64-cmake
            mingw-w64-clang-x86_64-ninja
            mingw-w64-clang-x86_64-pkgconf
            mingw-w64-clang-x86_64-python
            mingw-w64-clang-x86_64-vulkan-headers
            mingw-w64-clang-x86_64-vulkan-loader
            mingw-w64-clang-x86_64-vulkan-memory-allocator
            mingw-w64-clang-x86_64-glslang
            mingw-w64-clang-x86_64-sdl3
            mingw-w64-clang-x86_64-fmt
            mingw-w64-clang-x86_64-boost
            mingw-w64-clang-x86_64-robin-map
            mingw-w64-clang-x86_64-xxhash
            mingw-w64-clang-x86_64-ffmpeg
            mingw-w64-clang-x86_64-zydis
            mingw-w64-clang-x86_64-spirv-tools
            mingw-w64-clang-x86_64-spirv-headers
            mingw-w64-clang-x86_64-spirv-cross

      - name: Apply AVX emulation patch
        shell: msys2 {0}
        run: |
          cd source
          git submodule status
          git apply --check avx-emulation.patch
          git apply avx-emulation.patch

      - name: Build Windows binaries
        shell: msys2 {0}
        run: |
          cd source
          bash build.sh 2>&1 | tee out-build.log

      - name: Upload build outputs and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CTR-Q8400-experimental-windows
          path: |
            source/out/*.exe
            source/out/VERSION
            source/out/gpu-build.log
            source/out-build.log
          if-no-files-found: warn
          retention-days: 7
