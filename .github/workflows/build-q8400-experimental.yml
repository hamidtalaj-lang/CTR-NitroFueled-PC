name: Build CTR Q8400 experimental (Windows)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      GIT_CONFIG_COUNT: 1
      GIT_CONFIG_KEY_0: core.longpaths
      GIT_CONFIG_VALUE_0: "true"

    steps:
      - name: Checkout fork containing source archive and patch
        uses: actions/checkout@v4
        with:
          path: input

      - name: Verify files and extract source archive
        shell: pwsh
        run: |
          $archive = "input/CTR-NitroFueled-PC-0.4.zip"
          $patch = "input/CTR_Q8400_AVX_emulation_experimental.patch"

          if (!(Test-Path $archive)) {
            throw "Missing $archive. Put the source ZIP in the repository root."
          }
          if (!(Test-Path $patch)) {
            throw "Missing $patch. Put the experimental patch in the repository root."
          }

          Expand-Archive -LiteralPath $archive -DestinationPath source-unpacked -Force
          $root = Get-ChildItem source-unpacked -Directory | Select-Object -First 1
          if (!$root -or !(Test-Path (Join-Path $root.FullName "build.sh"))) {
            throw "Could not locate the extracted source root or build.sh."
          }

          "SOURCE_DIR=$($root.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Copy-Item $patch (Join-Path $root.FullName "CTR_Q8400_AVX_emulation_experimental.patch")

      - name: Set up MSYS2 CLANG64
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          install: >-
            git
            patch
            mingw-w64-clang-x86_64-toolchain
            mingw-w64-clang-x86_64-cmake
            mingw-w64-clang-x86_64-ninja
            mingw-w64-clang-x86_64-pkgconf
            mingw-w64-clang-x86_64-python
            mingw-w64-clang-x86_64-vulkan-headers
            mingw-w64-clang-x86_64-vulkan-loader
            mingw-w64-clang-x86_64-vulkan-memory-allocator
            mingw-w64-clang-x86_64-glslang
            mingw-w64-clang-x86_64-sdl3
            mingw-w64-clang-x86_64-fmt
            mingw-w64-clang-x86_64-boost
            mingw-w64-clang-x86_64-robin-map
            mingw-w64-clang-x86_64-xxhash
            mingw-w64-clang-x86_64-ffmpeg
            mingw-w64-clang-x86_64-zydis
            mingw-w64-clang-x86_64-spirv-tools
            mingw-w64-clang-x86_64-spirv-headers
            mingw-w64-clang-x86_64-spirv-cross

      - name: Initialize source snapshot and apply experimental patch
        shell: msys2 {0}
        run: |
          cd "$SOURCE_DIR"
          git init
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add -A
          git commit -m "Local source snapshot"
          git apply --check CTR_Q8400_AVX_emulation_experimental.patch
          git apply CTR_Q8400_AVX_emulation_experimental.patch

      - name: Populate submodules and pin FSR-Vulkan base
        shell: pwsh
        run: |
          $root = Get-ChildItem source-unpacked -Directory | Select-Object -First 1
          if (!$root) { throw "Extracted source directory not found." }

          $modules = @(
            @{ Path = "gpu/third_party/fsr-vulkan"; Url = "https://github.com/FireBurn/FSR-Vulkan.git" },
            @{ Path = "gpu/third_party/imgui"; Url = "https://github.com/ocornut/imgui.git" },
            @{ Path = "third_party/LibAtrac9"; Url = "https://github.com/Thealexbarney/LibAtrac9.git" },
            @{ Path = "gpu/third_party/magic_enum"; Url = "https://github.com/Neargye/magic_enum.git" },
            @{ Path = "gpu/third_party/miniz"; Url = "https://github.com/richgel999/miniz.git" },
            @{ Path = "gpu/third_party/xbyak"; Url = "https://github.com/herumi/xbyak.git" }
          )

          git config --global core.longpaths true
          foreach ($module in $modules) {
            $dest = Join-Path $root.FullName $module.Path
            if (Test-Path $dest) {
              Remove-Item $dest -Recurse -Force
            }
            New-Item -ItemType Directory -Force -Path (Split-Path $dest) | Out-Null

            if ($module.Path -eq "gpu/third_party/fsr-vulkan") {
              # Full history is needed because the required commit is older than HEAD.
              git -c core.longpaths=true clone $module.Url $dest
              if ($LASTEXITCODE -ne 0) {
                throw "Failed to clone full FSR-Vulkan history."
              }

              git -C $dest checkout --detach c64f093
              if ($LASTEXITCODE -ne 0) {
                throw "Commit c64f093 is not available in the FSR-Vulkan repository history."
              }
            } else {
              git -c core.longpaths=true clone --depth 1 $module.Url $dest
              if ($LASTEXITCODE -ne 0) {
                throw "Failed to clone submodule $($module.Path)"
              }
            }
          }

      - name: Skip all local FSR-Vulkan patches for this test build
        shell: pwsh
        run: |
          $root = Get-ChildItem source-unpacked -Directory | Select-Object -First 1
          if (!$root) { throw "Extracted source directory not found." }

          $buildScript = Join-Path $root.FullName "build.sh"
          $content = Get-Content -LiteralPath $buildScript -Raw
          $pattern = '(?ms)^    for patch in gpu/patches/fsr-vulkan/\*\.patch; do\r?\n.*?^    done\r?\n'
          $updated = [regex]::Replace($content, $pattern, '    # FSR-Vulkan local patches intentionally skipped for CPU compatibility test.\n', 1)

          if ($updated -eq $content) {
            throw "Could not find the Windows FSR patch loop in build.sh; refusing to continue."
          }

          Set-Content -LiteralPath $buildScript -Value $updated -Encoding utf8
          Write-Host "Disabled application of all local FSR-Vulkan patches. FSR itself is not removed."

      - name: Build Windows binaries
        shell: msys2 {0}
        run: |
          cd "$SOURCE_DIR"
          set -o pipefail
          bash build.sh 2>&1 | tee out-build.log

      - name: Upload build outputs and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CTR-Q8400-experimental-windows
          path: |
            source-unpacked/**/out/*.exe
            source-unpacked/**/out/VERSION
            source-unpacked/**/out/gpu-build.log
            source-unpacked/**/out-build.log
          if-no-files-found: warn
          retention-days: 7
