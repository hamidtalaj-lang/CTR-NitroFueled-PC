name: Build CTR Q8400 experimental (Windows)

on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "Upstream ref used only for submodule pins"
        default: "v0.4"
        required: true

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout fork (workflow, source zip and avx-emulation.patch)
        uses: actions/checkout@v4
        with:
          path: input

      - name: Checkout upstream only to get the pinned submodules
        uses: actions/checkout@v4
        with:
          repository: GetLostIn/CTR-NitroFueled-PC
          ref: ${{ inputs.upstream_ref }}
          submodules: recursive
          path: upstream

      - name: Extract the 0.4 zip, fill its submodule folders, copy patch
        shell: pwsh
        run: |
          $archive = Get-ChildItem input -Filter "CTR-NitroFueled-PC-0*.zip" | Select-Object -First 1
          if (!$archive) { throw "Missing CTR-NitroFueled-PC-0.4.zip in the root of your fork." }
          if (!(Test-Path input/avx-emulation.patch)) { throw "Missing avx-emulation.patch in the root of your fork." }
          Expand-Archive -LiteralPath $archive.FullName -DestinationPath source-unpacked -Force
          $root = Get-ChildItem source-unpacked -Directory | Select-Object -First 1
          if (!$root -or !(Test-Path (Join-Path $root.FullName "build.sh"))) { throw "Could not locate extracted source root/build.sh." }
          foreach ($d in @("gpu/third_party/fsr-vulkan","gpu/third_party/imgui","gpu/third_party/magic_enum","gpu/third_party/miniz","gpu/third_party/xbyak","third_party/LibAtrac9")) {
            $src = Join-Path (Resolve-Path upstream).Path $d
            $dst = Join-Path $root.FullName $d
            New-Item -ItemType Directory -Force -Path $dst | Out-Null
            robocopy $src $dst /E /XD .git /XF .git /NFL /NDL /NJH /NJS | Out-Null
            if ($LASTEXITCODE -ge 8) { throw "robocopy failed for $d" }
            $global:LASTEXITCODE = 0
          }
          "SOURCE_DIR=$($root.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Copy-Item input/avx-emulation.patch (Join-Path $root.FullName "avx-emulation.patch")

      - name: Set up MSYS2 CLANG64
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          install: >-
            git
            patch
            mingw-w64-clang-x86_64-toolchain
            mingw-w64-clang-x86_64-cmake
            mingw-w64-clang-x86_64-ninja
            mingw-w64-clang-x86_64-pkgconf
            mingw-w64-clang-x86_64-python
            mingw-w64-clang-x86_64-vulkan-headers
            mingw-w64-clang-x86_64-vulkan-loader
            mingw-w64-clang-x86_64-vulkan-memory-allocator
            mingw-w64-clang-x86_64-glslang
            mingw-w64-clang-x86_64-sdl3
            mingw-w64-clang-x86_64-fmt
            mingw-w64-clang-x86_64-boost
            mingw-w64-clang-x86_64-robin-map
            mingw-w64-clang-x86_64-xxhash
            mingw-w64-clang-x86_64-ffmpeg
            mingw-w64-clang-x86_64-zydis
            mingw-w64-clang-x86_64-spirv-tools
            mingw-w64-clang-x86_64-spirv-headers
            mingw-w64-clang-x86_64-spirv-cross

      - name: Snapshot source and apply AVX emulation patch
        shell: msys2 {0}
        run: |
          cd "$SOURCE_DIR"
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          # build.sh applies gpu/patches/fsr-vulkan/*.patch with `git -C gpu/third_party/fsr-vulkan apply`.
          # From a plain subfolder of another repo that call silently does nothing, so FSR-Vulkan
          # must be its own git repository (as a real submodule is).
          git -C gpu/third_party/fsr-vulkan init -q
          git -C gpu/third_party/fsr-vulkan add -A
          git -C gpu/third_party/fsr-vulkan commit -q -m "FSR-Vulkan pinned base"
          echo "fsr4 blob: $(git -C gpu/third_party/fsr-vulkan hash-object src/ffx_vk_fsr4_v07.c) (patch expects c30f7cf)"
          git init -q
          git add -A
          git commit -q -m "v0.4 source snapshot"
          git apply --check avx-emulation.patch
          git apply avx-emulation.patch

      - name: Build Windows binaries
        shell: msys2 {0}
        run: |
          cd "$SOURCE_DIR"
          bash build.sh 2>&1 | tee out-build.log

      - name: Upload build outputs and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CTR-Q8400-experimental-windows
          path: |
            source-unpacked/**/out/*.exe
            source-unpacked/**/out/VERSION
            source-unpacked/**/out/gpu-build.log
            source-unpacked/**/out-build.log
          if-no-files-found: warn
          retention-days: 7
