name: Build CTR Q8400 experimental (Windows)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout fork containing workflow, source archive, and patch
        uses: actions/checkout@v4
        with:
          path: input

      - name: Verify required files and extract exact v0.4 source snapshot
        shell: pwsh
        run: |
          $archive = "input/CTR-NitroFueled-PC-0.4.zip"
          $patch = "input/CTR_Q8400_AVX_emulation_experimental.patch"
          if (!(Test-Path $archive)) { throw "Missing $archive. Upload the exact CTR-NitroFueled-PC-0.4.zip to the root of your fork." }
          if (!(Test-Path $patch)) { throw "Missing $patch in the root of your fork." }
          Expand-Archive -LiteralPath $archive -DestinationPath source-unpacked -Force
          $root = Get-ChildItem source-unpacked -Directory | Select-Object -First 1
          if (!$root -or !(Test-Path (Join-Path $root.FullName "build.sh"))) { throw "Could not locate extracted source root/build.sh." }
          "SOURCE_DIR=$($root.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Copy-Item $patch (Join-Path $root.FullName "CTR_Q8400_AVX_emulation_experimental.patch")

      - name: Set up MSYS2 CLANG64
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          install: >-
            git
            patch
            mingw-w64-clang-x86_64-toolchain
            mingw-w64-clang-x86_64-cmake
            mingw-w64-clang-x86_64-ninja
            mingw-w64-clang-x86_64-pkgconf
            mingw-w64-clang-x86_64-python
            mingw-w64-clang-x86_64-vulkan-headers
            mingw-w64-clang-x86_64-vulkan-loader
            mingw-w64-clang-x86_64-vulkan-memory-allocator
            mingw-w64-clang-x86_64-glslang
            mingw-w64-clang-x86_64-sdl3
            mingw-w64-clang-x86_64-fmt
            mingw-w64-clang-x86_64-boost
            mingw-w64-clang-x86_64-robin-map
            mingw-w64-clang-x86_64-xxhash
            mingw-w64-clang-x86_64-ffmpeg
            mingw-w64-clang-x86_64-zydis
            mingw-w64-clang-x86_64-spirv-tools
            mingw-w64-clang-x86_64-spirv-headers
            mingw-w64-clang-x86_64-spirv-cross

      - name: Initialize source snapshot and apply patch
        shell: msys2 {0}
        run: |
          cd "$SOURCE_DIR"
          git init
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add -A
          git commit -m "Local v0.4 source snapshot"
          git apply --check CTR_Q8400_AVX_emulation_experimental.patch
          git apply CTR_Q8400_AVX_emulation_experimental.patch

      - name: Build Windows binaries
        shell: msys2 {0}
        run: |
          cd "$SOURCE_DIR"
          bash build.sh 2>&1 | tee out-build.log

      - name: Upload build outputs and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CTR-Q8400-experimental-windows
          path: |
            source-unpacked/**/out/*.exe
            source-unpacked/**/out/VERSION
            source-unpacked/**/out/gpu-build.log
            source-unpacked/**/out-build.log
          if-no-files-found: warn
          retention-days: 7
