name: Build CTR Q8400 experimental (FSR patches disabled)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      GIT_CONFIG_COUNT: 1
      GIT_CONFIG_KEY_0: core.longpaths
      GIT_CONFIG_VALUE_0: "true"
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          path: input

      - name: Extract source archive
        shell: pwsh
        run: |
          $archive = "input/CTR-NitroFueled-PC-0.4.zip"
          $patch = "input/CTR_Q8400_AVX_emulation_experimental.patch"
          if (!(Test-Path $archive)) { throw "Missing CTR-NitroFueled-PC-0.4.zip in repository root." }
          if (!(Test-Path $patch)) { throw "Missing CTR_Q8400_AVX_emulation_experimental.patch in repository root." }
          Expand-Archive -LiteralPath $archive -DestinationPath source-unpacked -Force
          $root = Get-ChildItem source-unpacked -Directory | Select-Object -First 1
          if (!$root -or !(Test-Path (Join-Path $root.FullName "build.sh"))) { throw "Could not find source root/build.sh." }
          "SOURCE_DIR=$($root.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Copy-Item $patch (Join-Path $root.FullName "CTR_Q8400_AVX_emulation_experimental.patch")

      - name: Set up MSYS2 CLANG64
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          install: >-
            git
            patch
            mingw-w64-clang-x86_64-toolchain
            mingw-w64-clang-x86_64-cmake
            mingw-w64-clang-x86_64-ninja
            mingw-w64-clang-x86_64-pkgconf
            mingw-w64-clang-x86_64-python
            mingw-w64-clang-x86_64-vulkan-headers
            mingw-w64-clang-x86_64-vulkan-loader
            mingw-w64-clang-x86_64-vulkan-memory-allocator
            mingw-w64-clang-x86_64-glslang
            mingw-w64-clang-x86_64-sdl3
            mingw-w64-clang-x86_64-fmt
            mingw-w64-clang-x86_64-boost
            mingw-w64-clang-x86_64-robin-map
            mingw-w64-clang-x86_64-xxhash
            mingw-w64-clang-x86_64-ffmpeg
            mingw-w64-clang-x86_64-zydis
            mingw-w64-clang-x86_64-spirv-tools
            mingw-w64-clang-x86_64-spirv-headers
            mingw-w64-clang-x86_64-spirv-cross

      - name: Apply experimental ISA patch
        shell: msys2 {0}
        run: |
          cd "$SOURCE_DIR"
          git init
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add -A
          git commit -m "Local source snapshot"
          git apply --check CTR_Q8400_AVX_emulation_experimental.patch
          git apply CTR_Q8400_AVX_emulation_experimental.patch

      - name: Populate dependencies and pin FSR base
        shell: pwsh
        run: |
          $root = Get-ChildItem source-unpacked -Directory | Select-Object -First 1
          $modules = @(
            @{ Path = "gpu/third_party/fsr-vulkan"; Url = "https://github.com/FireBurn/FSR-Vulkan.git" },
            @{ Path = "gpu/third_party/imgui"; Url = "https://github.com/ocornut/imgui.git" },
            @{ Path = "third_party/LibAtrac9"; Url = "https://github.com/Thealexbarney/LibAtrac9.git" },
            @{ Path = "gpu/third_party/magic_enum"; Url = "https://github.com/Neargye/magic_enum.git" },
            @{ Path = "gpu/third_party/miniz"; Url = "https://github.com/richgel999/miniz.git" },
            @{ Path = "gpu/third_party/xbyak"; Url = "https://github.com/herumi/xbyak.git" }
          )
          git config --global core.longpaths true
          foreach ($module in $modules) {
            $dest = Join-Path $root.FullName $module.Path
            if (Test-Path $dest) { Remove-Item $dest -Recurse -Force }
            New-Item -ItemType Directory -Force -Path (Split-Path $dest) | Out-Null
            git -c core.longpaths=true clone --depth 1 $module.Url $dest
            if ($LASTEXITCODE -ne 0) { throw "Failed to clone $($module.Path)" }
          }

      - name: Disable local FSR patch application (leave FSR code in build)
        shell: pwsh
        run: |
          $file = Join-Path $env:SOURCE_DIR "build.sh"
          $content = Get-Content -LiteralPath $file -Raw
          $pattern = '(?s)    for patch in gpu/patches/fsr-vulkan/\*\.patch; do\r?\n.*?\r?\n    done'
          if ($content -notmatch $pattern) { throw "Could not safely locate the FSR patch loop in build.sh; refusing to edit unrelated build commands." }
          $replacement = '    # FSR patch application disabled for this compatibility build; FSR library remains enabled.'
          $content = [regex]::Replace($content, $pattern, [System.Text.RegularExpressions.MatchEvaluator]{ param($m) $replacement }, 1)
          Set-Content -LiteralPath $file -Value $content -NoNewline
          # Verify the CMake continuation is still intact and print the relevant section.
          $lines = Get-Content -LiteralPath $file
          $cmakeIndex = -1
          for ($i=0; $i -lt $lines.Count; $i++) { if ($lines[$i] -match 'cmake -S gpu -B out/gpu') { $cmakeIndex = $i; break } }
          if ($cmakeIndex -lt 0 -or $lines[$cmakeIndex] -notmatch '\\$') { throw "CMake continuation line was not preserved." }
          $start = [Math]::Max(0, $cmakeIndex - 3)
          $end = [Math]::Min($lines.Count - 1, $cmakeIndex + 3)
          $lines[$start..$end] | ForEach-Object { Write-Host $_ }

      - name: Build Windows binaries
        shell: msys2 {0}
        env:
          BB_LTO: "OFF"
        run: |
          # Ensure CLANG64 tools are visible to the MSYS2 shell.
          export PATH="/clang64/bin:$PATH"
          echo "PATH=$PATH"
          echo "Checking required tools..."
          command -v cmake || { echo "ERROR: cmake not found"; exit 127; }
          command -v ninja || { echo "ERROR: ninja not found in PATH"; ls -la /clang64/bin/ninja* 2>/dev/null || true; exit 127; }
          cmake --version
          ninja --version
          cd "$SOURCE_DIR"
          set +e
          bash build.sh 2>&1 | tee out-build.log
          build_status=${PIPESTATUS[0]}
          if [ -f out/gpu-build.log ]; then
            echo "===== FULL out/gpu-build.log (including hidden command errors) ====="
            cat out/gpu-build.log
            echo "===== END out/gpu-build.log ====="
          fi
          exit "$build_status"

      - name: Upload build outputs and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CTR-Q8400-experimental-fsr-disabled
          path: |
            source-unpacked/**/out/*.exe
            source-unpacked/**/out/VERSION
            source-unpacked/**/out/gpu-build.log
            source-unpacked/**/out-build.log
          if-no-files-found: warn
          retention-days: 7
