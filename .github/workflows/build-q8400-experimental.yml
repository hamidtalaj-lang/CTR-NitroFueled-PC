name: Build CTR Q8400 experimental (Windows)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout this fork (workflow and patch)
        uses: actions/checkout@v4
        with:
          path: patch-repo
          submodules: false

      - name: Checkout clean upstream v0.4 source
        shell: pwsh
        run: |
          git clone --branch v0.4 --depth 1 --recurse-submodules https://github.com/GetLostIn/CTR-NitroFueled-PC.git source
          if ($LASTEXITCODE -ne 0) { throw 'Could not clone upstream v0.4 source and submodules.' }
          if (!(Test-Path 'patch-repo/CTR_Q8400_AVX_emulation_experimental.patch')) {
            throw 'Missing CTR_Q8400_AVX_emulation_experimental.patch in the root of your fork.'
          }
          Copy-Item 'patch-repo/CTR_Q8400_AVX_emulation_experimental.patch' 'source/CTR_Q8400_AVX_emulation_experimental.patch'

      - name: Set up MSYS2 CLANG64
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          install: >-
            git
            patch
            mingw-w64-clang-x86_64-toolchain
            mingw-w64-clang-x86_64-cmake
            mingw-w64-clang-x86_64-ninja
            mingw-w64-clang-x86_64-pkgconf
            mingw-w64-clang-x86_64-python
            mingw-w64-clang-x86_64-vulkan-headers
            mingw-w64-clang-x86_64-vulkan-loader
            mingw-w64-clang-x86_64-vulkan-memory-allocator
            mingw-w64-clang-x86_64-glslang
            mingw-w64-clang-x86_64-sdl3
            mingw-w64-clang-x86_64-fmt
            mingw-w64-clang-x86_64-boost
            mingw-w64-clang-x86_64-robin-map
            mingw-w64-clang-x86_64-xxhash
            mingw-w64-clang-x86_64-ffmpeg
            mingw-w64-clang-x86_64-zydis
            mingw-w64-clang-x86_64-spirv-tools
            mingw-w64-clang-x86_64-spirv-headers
            mingw-w64-clang-x86_64-spirv-cross

      - name: Apply experimental Q8400 patch to v0.4
        shell: msys2 {0}
        run: |
          cd source
          git apply --check CTR_Q8400_AVX_emulation_experimental.patch
          git apply CTR_Q8400_AVX_emulation_experimental.patch

      - name: Build Windows binaries
        shell: msys2 {0}
        run: |
          cd source
          bash build.sh

      - name: Upload build outputs and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CTR-Q8400-experimental-windows
          path: |
            source/out/*.exe
            source/out/VERSION
            source/out/gpu-build.log
          if-no-files-found: warn
          retention-days: 7
